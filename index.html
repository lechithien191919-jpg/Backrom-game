<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Backrooms - Safe Room & Lights</title>
    <style>
        body { margin: 0; overflow: hidden; background: #b89728; font-family: Arial, sans-serif; user-select: none; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffeb3b;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }
        #stamina-container {
            position: absolute;
            top: 55px;
            left: 20px;
            width: 150px;
            height: 12px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #ffeb3b;
            border-radius: 6px;
            z-index: 10;
            overflow: hidden;
        }
        #stamina-bar {
            width: 100%;
            height: 100%;
            background: #4caf50;
            transition: width 0.1s linear;
        }
        
        #inv-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #fff;
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            z-index: 20;
            cursor: pointer;
        }
        #inventory-panel {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #ffeb3b;
            border-radius: 10px;
            padding: 15px;
            color: #fff;
            width: 170px;
            z-index: 20;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }
        #inventory-panel h3 { margin: 0 0 10px 0; font-size: 15px; color: #ffeb3b; border-bottom: 1px solid #444; padding-bottom: 5px; }

        #message {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00e676;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            text-align: center;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            z-index: 15;
            pointer-events: none;
        }
        
        .control-btn {
            position: absolute;
            bottom: 60px;
            width: 75px;
            height: 75px;
            background: rgba(255, 235, 59, 0.2);
            border: 2px solid rgba(255, 235, 59, 0.8);
            border-radius: 50%;
            color: #ffeb3b;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            touch-action: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: background 0.2s;
        }
        #sprint-btn { right: 25px; }
        #pickup-btn { right: 110px; opacity: 0.4; pointer-events: none; background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); color: #888; }
        #pickup-btn.active { opacity: 1; pointer-events: auto; background: rgba(0, 230, 118, 0.3); border-color: #00e676; color: #00e676; }
        
        #sprint-btn.active {
            background: rgba(76, 175, 80, 0.7);
            border-color: #4caf50;
            color: #fff;
        }

        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            z-index: 10;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        #hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 1px 1px 2px #000;
        }
    </style>
</head>
<body>
    <div id="ui">BACKROOMS - Sống sót: <span id="score">0</span>s</div>
    <div id="stamina-container"><div id="stamina-bar"></div></div>
    
    <button id="inv-btn" onclick="toggleInventory()">📦 TÚI ĐỒ</button>
    <div id="inventory-panel">
        <h3>TÚI ĐỒ</h3>
        <div>💧 Nước hạnh nhân: <span id="water-count">0</span></div>
    </div>

    <div id="crosshair"></div>
    <div id="message">Đã nhặt Nước Hạnh Nhân! (+15s)</div>
    <div id="hint">Vuốt màn hình để xoay hướng & nhìn lên xuống</div>

    <div id="pickup-btn" class="control-btn">NHẶT</div>
    <div id="sprint-btn" class="control-btn">CHẠY</div>
    <div id="joystick-base">
        <div id="joystick-knob"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xb89728);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xfffaed, 0.9);
        scene.add(ambientLight);

        const wallMaterial = new THREE.MeshBasicMaterial({ color: 0xc49d3a });
        const pillarMaterial = new THREE.MeshBasicMaterial({ color: 0xcdb14c });
        const floorMat = new THREE.MeshBasicMaterial({ color: 0xdbcc76 });
        const ceilingMat = new THREE.MeshBasicMaterial({ color: 0xe3d488 });
        const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffee }); // Màu đèn huỳnh quang trên trần
        
        const tileSize = 10;
        const generatedChunks = new Set();
        const almondWaters = [];
        const collisionBoxes = [];
        let waterCount = 0;
        let survivalTime = 0;

        function toggleInventory() {
            const panel = document.getElementById('inventory-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function createAlmondWater(posX, posZ) {
            const geo = new THREE.CylinderGeometry(0.4, 0.4, 1.2, 8);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const bottle = new THREE.Mesh(geo, mat);
            bottle.position.set(posX, -4.4, posZ);
            scene.add(bottle);
            almondWaters.push({ mesh: bottle, x: posX, z: posZ, collected: false });
        }

        function updateInfiniteBackrooms(playerX, playerZ) {
            const renderDistance = 3;
            const pChunkX = Math.floor(playerX / tileSize);
            const pChunkZ = Math.floor(playerZ / tileSize);

            for (let x = pChunkX - renderDistance; x <= pChunkX + renderDistance; x++) {
                for (let z = pChunkZ - renderDistance; z <= pChunkZ + renderDistance; z++) {
                    const chunkKey = `${x},${z}`;
                    if (!generatedChunks.has(chunkKey)) {
                        generatedChunks.add(chunkKey);

                        const posX = x * tileSize;
                        const posZ = z * tileSize;

                        const floorGeo = new THREE.PlaneGeometry(tileSize, tileSize);
                        const floor = new THREE.Mesh(floorGeo, floorMat);
                        floor.rotation.x = -Math.PI / 2;
                        floor.position.set(posX, -5, posZ);
                        scene.add(floor);

                        const ceiling = new THREE.Mesh(floorGeo, ceilingMat);
                        ceiling.rotation.x = Math.PI / 2;
                        ceiling.position.set(posX, 5, posZ);
                        scene.add(ceiling);

                        // Thêm đèn huỳnh quang trên trần ở mỗi ô
                        const lightGeo = new THREE.PlaneGeometry(3, 0.8);
                        const ceilingLight = new THREE.Mesh(lightGeo, lightMat);
                        ceilingLight.rotation.x = Math.PI / 2;
                        ceilingLight.position.set(posX, 4.98, posZ);
                        scene.add(ceilingLight);

                        // KHU VỰC PHÒNG NGHỈ NGƠI RỘNG RÃI (Safe Room ở gốc tọa độ 0,0 và vùng lân cận)
                        const isSafeRoomArea = (Math.abs(x) <= 2 && Math.abs(z) <= 2);

                        if (isSafeRoomArea) {
                            // Phòng rộng lớn trống trải không có tường vướng víu để nghỉ ngơi thoải mái
                            if (Math.abs(x) === 2 || Math.abs(z) === 2) {
                                // Chỉ tạo tường bao xung quanh khu vực phòng nghỉ rộng
                                const wallGeo = new THREE.BoxGeometry(tileSize, 10, tileSize);
                                const wall = new THREE.Mesh(wallGeo, wallMaterial);
                                wall.position.set(posX, 0, posZ);
                                scene.add(wall);
                                collisionBoxes.push({ minX: posX - 4.5, maxX: posX + 4.5, minZ: posZ - 4.5, maxZ: posZ + 4.5 });
                            } else if (x === 0 && z === 0) {
                                // Đặt vài chai nước hạnh nhân hỗ trợ ngay tại giữa phòng nghỉ lớn
                                createAlmondWater(posX + 2, posZ + 2);
                                createAlmondWater(posX - 2, posZ - 2);
                            }
                        } else {
                            // Mê cung thông thường bên ngoài
                            const isBigHallway = (Math.abs(x % 10) < 3 && Math.abs(z % 10) < 3);

                            if (isBigHallway) {
                                if (Math.abs(x % 3) === 0 && Math.abs(z % 3) === 0) {
                                    const pillarGeo = new THREE.BoxGeometry(4, 10, 4);
                                    const pillar = new THREE.Mesh(pillarGeo, pillarMaterial);
                                    pillar.position.set(posX, 0, posZ);
                                    scene.add(pillar);

                                    collisionBoxes.push({ minX: posX - 2, maxX: posX + 2, minZ: posZ - 2, maxZ: posZ + 2 });

                                    if (Math.random() < 0.4) {
                                        createAlmondWater(posX + 2, posZ + 2);
                                    }
                                }
                            } else {
                                const mazePattern = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453;
                                if (Math.floor(Math.abs(mazePattern) * 10) % 3 === 0) {
                                    const wallGeo = new THREE.BoxGeometry(tileSize, 10, tileSize);
                                    const wall = new THREE.Mesh(wallGeo, wallMaterial);
                                    wall.position.set(posX, 0, posZ);
                                    scene.add(wall);

                                    collisionBoxes.push({ minX: posX - 4.5, maxX: posX + 4.5, minZ: posZ - 4.5, maxZ: posZ + 4.5 });
                                }
                            }
                        }
                    }
                }
            }
        }

        camera.position.set(0, 0, 0);
        let yaw = 0;
        let pitch = 0;
        updateInfiniteBackrooms(0, 0);

        function checkCollision(nextX, nextZ) {
            const playerRadius = 0.3;
            for (let box of collisionBoxes) {
                if (
                    nextX + playerRadius > box.minX &&
                    nextX - playerRadius < box.maxX &&
                    nextZ + playerRadius > box.minZ &&
                    nextZ - playerRadius < box.maxZ
                ) {
                    return true;
                }
            }
            return false;
        }

        let isDragging = false;
        let prevX = 0, prevY = 0;
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('#sprint-btn') || e.target.closest('#pickup-btn') || e.target.closest('#joystick-base') || e.target.closest('#inv-btn') || e.target.closest('#inventory-panel')) return;
            isDragging = true;
            prevX = e.touches[0].clientX;
            prevY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            for (let i = 0; i < e.touches.length; i++) {
                const currentX = e.touches[i].clientX;
                const currentY = e.touches[i].clientY;
                yaw -= (currentX - prevX) * 0.004;
                pitch -= (currentY - prevY) * 0.004;
                
                const maxPitch = Math.PI / 2.2;
                if (pitch > maxPitch) pitch = maxPitch;
                if (pitch < -maxPitch) pitch = -maxPitch;

                prevX = currentX;
                prevY = currentY;
                break;
            }
        }, { passive: true });

        window.addEventListener('touchend', () => { isDragging = false; });

        const joystickBase = document.getElementById('joystick-base');
        const joystickKnob = document.getElementById('joystick-knob');
        let moveVector = { x: 0, z: 0 };
        let joystickTouchId = null;

        joystickBase.addEventListener('touchstart', (e) => {
            e.preventDefault();
            joystickTouchId = e.changedTouches[0].identifier;
        });

        joystickBase.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    const rect = joystickBase.getBoundingClientRect();
                    let dx = touch.clientX - (rect.left + rect.width / 2);
                    let dy = touch.clientY - (rect.top + rect.height / 2);
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxR = 45;
                    if (dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
                    joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                    moveVector.x = dx / maxR;
                    moveVector.z = dy / maxR;
                }
            }
        });

        const resetJoystick = () => {
            joystickTouchId = null;
            joystickKnob.style.transform = `translate(0px, 0px)`;
            moveVector = { x: 0, z: 0 };
        };
        joystickBase.addEventListener('touchend', resetJoystick);
        joystickBase.addEventListener('touchcancel', resetJoystick);

        let isSprinting = false;
        let stamina = 100;
        const sprintBtn = document.getElementById('sprint-btn');
        const pickupBtn = document.getElementById('pickup-btn');
        const staminaBar = document.getElementById('stamina-bar');

        sprintBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!isSprinting && stamina > 5) {
                isSprinting = true;
                sprintBtn.classList.add('active');
            } else {
                isSprinting = false;
                sprintBtn.classList.remove('active');
            }
        });

        let targetWater = null;
        pickupBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (targetWater && !targetWater.collected) {
                targetWater.collected = true;
                scene.remove(targetWater.mesh);
                waterCount++;
                survivalTime += 15;
                document.getElementById('water-count').innerText = waterCount;
                showMsg("Đã nhặt Nước Hạnh Nhân! (+15s)");
                targetWater = null;
                pickupBtn.classList.remove('active');
            }
        });

        setInterval(() => {
            survivalTime++;
            document.getElementById('score').innerText = survivalTime;
        }, 1000);

        function showMsg(txt) {
            const m = document.getElementById('message');
            m.innerText = txt;
            m.style.opacity = '1';
            setTimeout(() => { m.style.opacity = '0'; }, 1500);
        }

        const normalSpeed = 0.1;
        const sprintSpeed = 0.22;
        const raycaster = new THREE.Raycaster();
        const centerVector = new THREE.Vector2(0, 0);

        function animate() {
            requestAnimationFrame(animate);

            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            let currentSpeed = normalSpeed;
            if (isSprinting && (moveVector.x !== 0 || moveVector.z !== 0)) {
                stamina -= 0.8;
                currentSpeed = sprintSpeed;
                if (stamina <= 0) {
                    stamina = 0;
                    isSprinting = false;
                    sprintBtn.classList.remove('active');
                }
            } else {
                if (stamina < 100) stamina += 0.3;
            }
            staminaBar.style.width = stamina + '%';

            if (moveVector.x !== 0 || moveVector.z !== 0) {
                const moveDir = new THREE.Vector3(moveVector.x, 0, moveVector.z);
                moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                const nextX = camera.position.x + moveDir.x * currentSpeed;
                const nextZ = camera.position.z + moveDir.z * currentSpeed;

                if (!checkCollision(nextX, camera.position.z)) {
                    camera.position.x = nextX;
                }
                if (!checkCollision(camera.position.x, nextZ)) {
                    camera.position.z = nextZ;
                }

                updateInfiniteBackrooms(camera.position.x, camera.position.z);
            }

            const activeBottles = almondWaters.filter(w => !w.collected).map(w => w.mesh);
            if (activeBottles.length > 0) {
                raycaster.setFromCamera(centerVector, camera);
                const intersects = raycaster.intersectObjects(activeBottles);

                targetWater = null;
                if (intersects.length > 0) {
                    const hitObj = intersects[0].object;
                    const dist = camera.position.distanceTo(hitObj.position);
                    if (dist <= 4.5) {
                        targetWater = almondWaters.find(w => w.mesh === hitObj);
                    }
                }
            } else {
                targetWater = null;
            }

            if (targetWater) {
                pickupBtn.classList.add('active');
            } else {
                pickupBtn.classList.remove('active');
            }

            almondWaters.forEach(w => {
                if (!w.collected) {
                    w.mesh.ro
