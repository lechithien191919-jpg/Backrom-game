<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Backrooms Full Features</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; user-select: none; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffeb3b;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }
        #stamina-container {
            position: absolute;
            top: 55px;
            left: 20px;
            width: 150px;
            height: 12px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #ffeb3b;
            border-radius: 6px;
            z-index: 10;
            overflow: hidden;
        }
        #stamina-bar {
            width: 100%;
            height: 100%;
            background: #4caf50;
            transition: width 0.1s linear;
        }
        #inventory {
            position: absolute;
            top: 80px;
            left: 20px;
            color: #fff;
            font-size: 16px;
            text-shadow: 1px 1px 2px #000;
            z-index: 10;
        }
        #message {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00e676;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }
        
        /* Nút Chạy nước rút (Sprint) */
        #sprint-btn {
            position: absolute;
            bottom: 60px;
            right: 40px;
            width: 85px;
            height: 85px;
            background: rgba(255, 235, 59, 0.3);
            border: 2px solid rgba(255, 235, 59, 0.8);
            border-radius: 50%;
            color: #ffeb3b;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            touch-action: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        /* Joystick ảo di chuyển */
        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            z-index: 10;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        #hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 1px 1px 2px #000;
        }
    </style>
</head>
<body>
    <div id="ui">BACKROOMS - Sống sót: <span id="score">0</span>s</div>
    <div id="stamina-container"><div id="stamina-bar"></div></div>
    <div id="inventory">💧 Nước hạnh nhân: <span id="water-count">0</span></div>
    <div id="message">Đã nhặt Nước Hạnh Nhân! (+15s)</div>
    <div id="hint">Vuốt màn hình ngang để xoay góc nhìn</div>

    <!-- Nút chạy & Joystick -->
    <div id="sprint-btn">CHẠY</div>
    <div id="joystick-base">
        <div id="joystick-knob"></div>
    </div>

    <!-- Web Audio API tạo âm thanh nền & tiếng bước chân -->
    <script>
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                playAmbientHum();
            }
        }

        // Âm thanh đèn huỳnh quang rè rè ám ảnh
        function playAmbientHum() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(60, audioCtx.currentTime); // Tần số thấp tạo tiếng rè
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
        }

        // Tiếng bước chân
        function playFootstep() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        window.addEventListener('touchstart', initAudio, { once: true });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd4af37);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Ánh sáng phòng có thể chớp tắt
        const ambientLight = new THREE.AmbientLight(0xfffff0, 1.0);
        scene.add(ambientLight);

        // Vật liệu
        const wallMaterial = new THREE.MeshBasicMaterial({ color: 0xc49d3a });
        const pillarMaterial = new THREE.MeshBasicMaterial({ color: 0xcdb14c });
        const floorMat = new THREE.MeshBasicMaterial({ color: 0xdbcc76 });
        const ceilingMat = new THREE.MeshBasicMaterial({ color: 0xe3d488 });
        
        const tileSize = 10;
        const generatedChunks = new Set();
        const almondWaters = []; // Danh sách chai nước rải rác
        let waterCount = 0;
        let survivalTime = 0;

        // Tạo vật phẩm Nước Hạnh Nhân 3D đơn giản
        function createAlmondWater(posX, posZ) {
            const geo = new THREE.CylinderGeometry(0.4, 0.4, 1.2, 8);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
            const bottle = new THREE.Mesh(geo, mat);
            bottle.position.set(posX, -4.4, posZ);
            scene.add(bottle);
            almondWaters.push({ mesh: bottle, x: posX, z: posZ, collected: false });
        }

        // Sinh bản đồ vô tận + rải vật phẩm
        function updateInfiniteBackrooms(playerX, playerZ) {
            const renderDistance = 4;
            const pChunkX = Math.floor(playerX / tileSize);
            const pChunkZ = Math.floor(playerZ / tileSize);

            for (let x = pChunkX - renderDistance; x <= pChunkX + renderDistance; x++) {
                for (let z = pChunkZ - renderDistance; z <= pChunkZ + renderDistance; z++) {
                    const chunkKey = `${x},${z}`;
                    if (!generatedChunks.has(chunkKey)) {
                        generatedChunks.add(chunkKey);

                        const posX = x * tileSize;
                        const posZ = z * tileSize;

                        const floorGeo = new THREE.PlaneGeometry(tileSize, tileSize);
                        const floor = new THREE.Mesh(floorGeo, floorMat);
                        floor.rotation.x = -Math.PI / 2;
                        floor.position.set(posX, -5, posZ);
                        scene.add(floor);

                        const ceiling = new THREE.Mesh(floorGeo, ceilingMat);
                        ceiling.rotation.x = Math.PI / 2;
                        ceiling.position.set(posX, 5, posZ);
                        scene.add(ceiling);

                        const isBigHallway = (Math.abs(x % 10) < 3 && Math.abs(z % 10) < 3);

                        if (isBigHallway) {
                            if (Math.abs(x % 3) === 0 && Math.abs(z % 3) === 0) {
                                const pillarGeo = new THREE.BoxGeometry(4, 10, 4);
                                const pillar = new THREE.Mesh(pillarGeo, pillarMaterial);
                                pillar.position.set(posX, 0, posZ);
                                scene.add(pillar);

                                // Rải chai nước ở các góc sảnh nghỉ ngơi
                                if (Math.random() < 0.4) {
                                    createAlmondWater(posX + 2, posZ + 2);
                                }
                            }
                        } else {
                            const mazePattern = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453;
                            if (Math.floor(Math.abs(mazePattern) * 10) % 3 === 0) {
                                const wallGeo = new THREE.BoxGeometry(tileSize, 10, tileSize);
                                const wall = new THREE.Mesh(wallGeo, wallMaterial);
                                wall.position.set(posX, 0, posZ);
                                scene.add(wall);
                            }
                        }
                    }
                }
            }
        }

        camera.position.set(0, 0, 0);
        let yaw = 0;
        updateInfiniteBackrooms(0, 0);

        // Xử lý vuốt màn hình xoay nhìn
        let isDragging = false;
        let prevX = 0;
        window.addEventListener('touchstart', (e) => {
            if (e.touches[0].clientX < 180 && e.touches[0].clientY > window.innerHeight - 180) return;
            isDragging = true;
            prevX = e.touches[0].clientX;
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const currentX = e.touches[0].clientX;
            yaw -= (currentX - prevX) * 0.004;
            prevX = currentX;
        });
        window.addEventListener('touchend', () => { isDragging = false; });

        // Joystick điều khiển di chuyển
        const joystickBase = document.getElementById('joystick-base');
        const joystickKnob = document.getElementById('joystick-knob');
        let moveVector = { x: 0, z: 0 };
        let joystickTouchId = null;

        joystickBase.addEventListener('touchstart', (e) => {
            e.preventDefault();
            joystickTouchId = e.changedTouches[0].identifier;
        });
        joystickBase.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    const rect = joystickBase.getBoundingClientRect();
                    let dx = touch.clientX - (rect.left + rect.width / 2);
                    let dy = touch.clientY - (rect.top + rect.height / 2);
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxR = 45;
                    if (dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
                    joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                    moveVector.x = dx / maxR;
                    moveVector.z = dy / maxR;
                }
            }
        });
        const resetJoystick = () => {
            joystickTouchId = null;
            joystickKnob.style.transform = `translate(0px, 0px)`;
            moveVector = { x: 0, z: 0 };
        };
        joystickBase.addEventListener('touchend', resetJoystick);
        joystickBase.addEventListener('touchcancel', resetJoystick);

        // Nút Chạy & Thể lực (Stamina)
        let isSprinting = false;
        let stamina = 100;
        const sprintBtn = document.getElementById('sprint-btn');
        const staminaBar = document.getElementById('stamina-bar');

        sprintBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if(stamina > 10) isSprinting = true; });
        sprintBtn.addEventListener('touchend', (e) => { e.preventDefault(); isSprinting = false; });

        // Bộ đếm thời gian sinh tồn
        setInterval(() => {
            survivalTime++;
            document.getElementById('score').innerText = survivalTime;
        }, 1000);

        // Hiển thị thông báo nhặt đồ
        function showMsg(txt) {
            const m = document.getElementById('message');
            m.innerText = txt;
            m.style.opacity = '1';
            setTimeout(() => { m.style.opacity = '0'; }, 1500);
        }

        // Vòng lặp game chính
        let stepTimer = 0;
        const normalSpeed = 0.1;
        const sprintSpeed = 0.22;

        function animate() {
            requestAnimationFrame(animate);

            camera.rotation.set(0, yaw, 0);

            // Xử lý thể lực chạy
            let currentSpeed = normalSpeed;
            if (isSprinting && (moveVector.x !== 0 || moveVector.z !== 0)) {
                stamina -= 0.8;
                currentSpeed = sprintSpeed;
                if (stamina <= 0) { stamina = 0; isSprinting = false; }
            } else {
                if (stamina < 100) stamina += 0.3;
            }
            staminaBar.style.width = stamina + '%';

            // Di chuyển nhân vật
            if (moveVector.x !== 0 || moveVector.z !== 0) {
                const moveDir = new THREE.Vector3(moveVector.x, 0, moveVector.z);
                moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                camera.position.addScaledVector(moveDir, currentSpeed);

                updateInfiniteBackrooms(camera.position.x, camera.position.z);

                // Phát tiếng bước chân theo nhịp
                stepTimer += currentSpeed;
                if (stepTimer > 1.2) {
                    playFootstep();
                    stepTimer = 0;
                }
            }

            // Hiệu ứng đèn chập chờn (Flicker) ngẫu nhiên
            if (Math.random() < 0.03) {
                ambientLight.intensity = Math.random() < 0.3 ? 0.3 : 1.0;
            }

            // Kiểm tra nhặt Nước Hạnh Nhân khi đi lại gần
            almondWaters.forEach(w => {
                if (!w.collected) {
                    w.mesh.rotation.y += 0.05;
                    const dist = camera.position.distanceTo(w.mesh.position);
                    if (dist < 3.5) {
                        w.collected = true;
                        scene.remove(w.mesh);
                        waterCount++;
                        survivalTime += 15; // Thưởng thời gian sinh tồn
                        document.getElementById('water-count').innerText = waterCount;
                        showMsg("Đã nhặt Nước Hạnh Nhân! (+15s)");
                    }
                }
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
