<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backrooms 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ffeb3b;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="ui">BACKROOMS - Sống sót: <span id="score">0</span>s</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Khởi tạo Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd4af37); // Màu vàng kinh điển Backrooms

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Thêm ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);

        // 3. Tạo các bức tường hành lang Backrooms để thấy không gian 3D rõ hơn
        const wallMaterial = new THREE.MeshBasicMaterial({ color: 0xb5902d, wireframe: false });
        
        // Tường trái
        const wallLeftGeo = new THREE.BoxGeometry(2, 10, 50);
        const wallLeft = new THREE.Mesh(wallLeftGeo, wallMaterial);
        wallLeft.position.set(-6, 0, -20);
        scene.add(wallLeft);

        // Tường phải
        const wallRight = new THREE.Mesh(wallLeftGeo, wallMaterial);
        wallRight.position.set(6, 0, -20);
        scene.add(wallRight);

        // Tường trước mặt
        const wallBackGeo = new THREE.BoxGeometry(14, 10, 2);
        const wallBack = new THREE.Mesh(wallBackGeo, wallMaterial);
        wallBack.position.set(0, 0, -45);
        scene.add(wallBack);

        // Đặt vị trí camera đứng giữa hành lang
        camera.position.set(0, 0, 5);

        let survivalTime = 0;
        setInterval(() => {
            survivalTime++;
            document.getElementById('score').innerText = survivalTime;
        }, 1000);

        // 4. Hiệu ứng camera tiến/lùi hoặc di chuyển trong hành lang
        let zPos = 5;
        function animate() {
            requestAnimationFrame(animate);
            
            // Cho camera tiến dần về phía trước tạo cảm giác đang đi sâu vào Backrooms
            zPos -= 0.05;
            if (zPos < -30) zPos = 5; // Lặp lại hành lang
            camera.position.z = zPos;

            renderer.render(scene, camera);
        }
        animate();

        // Xử lý xoay ngang dọc theo màn hình điện thoại
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
