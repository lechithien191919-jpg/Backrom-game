<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Backrooms Maze & Hallway</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; user-select: none; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffeb3b;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }
        
        /* Joystick ảo di chuyển */
        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            z-index: 10;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        #hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 1px 1px 2px #000;
        }
    </style>
</head>
<body>
    <div id="ui">BACKROOMS - Sống sót: <span id="score">0</span>s</div>
    <div id="hint">Vuốt màn hình ngang để xoay góc nhìn</div>

    <!-- Joystick ảo -->
    <div id="joystick-base">
        <div id="joystick-knob"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Khởi tạo không gian 3D
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd4af37);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xfffff0, 1.0);
        scene.add(ambientLight);

        // Vật liệu
        const wallMaterial = new THREE.MeshBasicMaterial({ color: 0xc49d3a });
        const pillarMaterial = new THREE.MeshBasicMaterial({ color: 0xcdb14c });
        const floorMat = new THREE.MeshBasicMaterial({ color: 0xdbcc76 });
        const ceilingMat = new THREE.MeshBasicMaterial({ color: 0xe3d488 });
        
        const tileSize = 10;
        const generatedChunks = new Set();

        // Thuật toán phân chia khu vực: Đan xen giữa hành lang mê cung hẹp và sảnh lớn nghỉ ngơi
        function updateInfiniteBackrooms(playerX, playerZ) {
            const renderDistance = 4;
            const pChunkX = Math.floor(playerX / tileSize);
            const pChunkZ = Math.floor(playerZ / tileSize);

            for (let x = pChunkX - renderDistance; x <= pChunkX + renderDistance; x++) {
                for (let z = pChunkZ - renderDistance; z <= pChunkZ + renderDistance; z++) {
                    const chunkKey = `${x},${z}`;
                    if (!generatedChunks.has(chunkKey)) {
                        generatedChunks.add(chunkKey);

                        const posX = x * tileSize;
                        const posZ = z * tileSize;

                        // Tạo sàn và trần cho mọi ô
                        const floorGeo = new THREE.PlaneGeometry(tileSize, tileSize);
                        const floor = new THREE.Mesh(floorGeo, floorMat);
                        floor.rotation.x = -Math.PI / 2;
                        floor.position.set(posX, -5, posZ);
                        scene.add(floor);

                        const ceiling = new THREE.Mesh(floorGeo, ceilingMat);
                        ceiling.rotation.x = Math.PI / 2;
                        ceiling.position.set(posX, 5, posZ);
                        scene.add(ceiling);

                        // Xác định khu vực: Cứ cách một đoạn xa sẽ là "Sảnh lớn nghỉ ngơi", còn lại là "Hành lang mê cung"
                        const isBigHallway = (Math.abs(x % 10) < 3 && Math.abs(z % 10) < 3);

                        if (isBigHallway) {
                            // Đây là Sảnh lớn nghỉ ngơi (Không gian rộng, có cột trụ)
                            if (Math.abs(x % 3) === 0 && Math.abs(z % 3) === 0) {
                                const pillarGeo = new THREE.BoxGeometry(4, 10, 4);
                                const pillar = new THREE.Mesh(pillarGeo, pillarMaterial);
                                pillar.position.set(posX, 0, posZ);
                                scene.add(pillar);
                            }
                        } else {
                            // Đây là Hành lang mê cung hẹp nối dài
                            // Sử dụng hàm toán học giả ngẫu nhiên dựa trên tọa độ để tạo tường mê cung cố định, không đổi
                            const mazePattern = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453;
                            if (Math.floor(Math.abs(mazePattern) * 10) % 3 === 0) {
                                const wallGeo = new THREE.BoxGeometry(tileSize, 10, tileSize);
                                const wall = new THREE.Mesh(wallGeo, wallMaterial);
                                wall.position.set(posX, 0, posZ);
                                scene.add(wall);
                            }
                        }
                    }
                }
            }
        }

        // Vị trí xuất phát ở sảnh lớn
        camera.position.set(0, 0, 0);
        let yaw = 0;

        updateInfiniteBackrooms(0, 0);

        // 2. Xử lý vuốt màn hình ngang xoay góc nhìn
        let isDragging = false;
        let prevX = 0;

        window.addEventListener('touchstart', (e) => {
            if (e.touches[0].clientX < 180 && e.touches[0].clientY > window.innerHeight - 180) return;
            isDragging = true;
            prevX = e.touches[0].clientX;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const currentX = e.touches[0].clientX;
            const deltaX = currentX - prevX;
            yaw -= deltaX * 0.004;
            prevX = currentX;
        });

        window.addEventListener('touchend', () => { isDragging = false; });

        // 3. Joystick ảo di chuyển
        const joystickBase = document.getElementById('joystick-base');
        const joystickKnob = document.getElementById('joystick-knob');
        let moveVector = { x: 0, z: 0 };
        let joystickTouchId = null;

        joystickBase.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
        });

        joystickBase.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    const rect = joystickBase.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    
                    let dx = touch.clientX - centerX;
                    let dy = touch.clientY - centerY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const maxRadius = 45;

                    if (distance > maxRadius) {
                        dx = (dx / distance) * maxRadius;
                        dy = (dy / distance) * maxRadius;
                    }

                    joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                    moveVector.x = dx / maxRadius;
                    moveVector.z = dy / maxRadius;
                }
            }
        });

        const resetJoystick = () => {
            joystickTouchId = null;
            joystickKnob.style.transform = `translate(0px, 0px)`;
            moveVector = { x: 0, z: 0 };
        };

        joystickBase.addEventListener('touchend', resetJoystick);
        joystickBase.addEventListener('touchcancel', resetJoystick);

        // Bộ đếm thời gian
        let survivalTime = 0;
        setInterval(() => {
            survivalTime++;
            document.getElementById('score').innerText = survivalTime;
        }, 1000);

        // 4. Vòng lặp game
        const speed = 0.1;
        function animate() {
            requestAnimationFrame(animate);

            camera.rotation.set(0, yaw, 0);

            if (moveVector.x !== 0 || moveVector.z !== 0) {
                const moveDir = new THREE.Vector3(moveVector.x, 0, moveVector.z);
                moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                camera.position.addScaledVector(moveDir, speed);

                // Sinh map liên tục theo bước chân người chơi
                updateInfiniteBackrooms(camera.position.x, camera.position.z);
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
